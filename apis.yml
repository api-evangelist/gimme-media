name: Gimme Media
description: >-
  Gimme Media is the Techstars-backed music company behind Gimme Radio, the
  heavy-metal streaming and live-DJ radio platform that later expanded into
  Gimme Metal and Gimme Country. The standalone streaming apps were wound down,
  and the brand now operates as a Shopify-hosted storefront at gimmemetal.com
  selling vinyl, merchandise, and exclusive releases to the metal community.
  As of this enrichment pass Gimme Media publishes no first-party public
  developer API, SDKs, OpenAPI definition, or developer documentation; the only
  machine-readable surfaces served at its domain are the Shopify Customer
  Accounts platform OIDC endpoints, which belong to the hosting platform rather
  than to a Gimme Media API.
